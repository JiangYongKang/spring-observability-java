spring.application.name=spring-observability-java

# 随机端口，便于本地与测试独立复现
server.port=8080

# 抛出 NoHandlerFoundException，使“无路由”也能走到统一异常处理；
# 但指标过滤器仍因取不到路由模板而跳过，不新建维度
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# 关闭服务端错误页的默认 HTML/消息泄露，统一由 GlobalExceptionHandler 输出 JSON
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# 日志：每行固定携带 关联标识 / 路由模板 / 错误分类（MDC 缺失时输出 -）
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] correlationId=%X{correlationId:--} routeTemplate=%X{routeTemplate:--} errorCategory=%X{errorCategory:--} logger=%logger{36} - %msg%n
